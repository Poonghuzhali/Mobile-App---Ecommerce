# Render Blueprint — Django API on SQLite (persistent disk)
# Dashboard: New → Blueprint → connect repo → Apply
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: vexo-cart-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health/
    disk:
      name: vexo-cart-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "True"
      - key: SQLITE_DB_PATH
        value: "/var/data/db.sqlite3"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: RAZORPAY_TEST_MODE_ONLY
        value: "True"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_SIGNUP_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
