{% extends "adminpanel/base.html" %}
{% block content %}
<div class="row-between">
  <h1>Products</h1>
  <a class="btn" href="{% url 'adminpanel_product_new' %}">Add product</a>
</div>
<table>
  <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Featured</th><th></th></tr></thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.category.name }}</td>
      <td>₹{{ p.effective_price }}</td>
      <td class="{% if p.stock <= 5 %}warn{% endif %}">{{ p.stock }}</td>
      <td>{% if p.is_featured %}Yes{% else %}—{% endif %}</td>
      <td>
        <a href="{% url 'adminpanel_product_edit' p.pk %}">Edit</a>
        <a href="{% url 'adminpanel_product_delete' p.pk %}">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
