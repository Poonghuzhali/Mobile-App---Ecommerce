{% extends "adminpanel/base.html" %}
{% block content %}
<div class="row-between"><h1>Categories</h1><a class="btn" href="{% url 'adminpanel_category_new' %}">Add category</a></div>
<table>
  <thead><tr><th>Name</th><th>Products</th><th>Active</th><th></th></tr></thead>
  <tbody>
    {% for c in categories %}
    <tr>
      <td>{{ c.name }}</td><td>{{ c.product_count }}</td><td>{{ c.is_active }}</td>
      <td><a href="{% url 'adminpanel_category_edit' c.pk %}">Edit</a> <a href="{% url 'adminpanel_category_delete' c.pk %}">Delete</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
